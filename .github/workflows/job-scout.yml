name: Job scout

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min; GitHub may delay or skip runs under load
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scout/**", "data/accredited-employer-checks.csv", ".github/workflows/job-scout.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch jobs
        run: python scout/fetch_jobs.py

      - name: Commit if jobs or interview links changed
        id: commit
        run: |
          git add -N site/ 2>/dev/null || true
          if git diff --quiet -- site/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to commit."
          else
            git config user.name "job-scout-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/
            git commit -m "Update job listings ($(python -c 'import json;d=json.load(open("site/jobs.json"));print(d["count"], "jobs,", len(d["added"]), "new")'))"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scout
    if: needs.scout.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
